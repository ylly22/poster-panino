<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panino Interattivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f6846; }
    canvas { display: block; margin: 0 auto; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="https://unpkg.com/paper@0.12.17/dist/paper-full.min.js"></script>
  <script>
    var svgRoot;

    function resizeCanvas() {
      var canvas = document.getElementById('canvas');
      var w = window.innerWidth;
      var h = window.innerHeight;
      var svgAspect = 841.89 / 1190.55;
      var winAspect = w / h;
      var cw, ch;
      if (winAspect > svgAspect) {
        ch = h;
        cw = h * svgAspect;
      } else {
        cw = w;
        ch = w / svgAspect;
      }
      cw = Math.round(cw);
      ch = Math.round(ch);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.width = cw;
      canvas.height = ch;
    }

    resizeCanvas();
    paper.setup('canvas');

    window.addEventListener('resize', function() {
      resizeCanvas();
      if (paper.view) {
        paper.view.viewSize = new paper.Size(canvas.width, canvas.height);
      }
      if (svgRoot) fitViewToSvg();
    });

    function fitViewToSvg() {
      var scale = Math.min(
        paper.view.viewSize.width / 841.89,
        paper.view.viewSize.height / 1190.55
      );
      paper.view.zoom = scale;
      paper.view.center = new paper.Point(841.89 / 2, 1190.55 / 2);
    }

    fetch('poster.svg')
      .then(function(response) { return response.text(); })
      .then(function(svgString) {
        var svg = paper.project.importSVG(svgString, { expandShapes: true });
        svgRoot = svg;
        fitViewToSvg();
        initIngredients(svg);
      });

    var DRAGGABLE_IDS = ['cipolla', 'Insalata', 'Hamburger', 'Bacon', 'Formaggio', 'Panino_superiore', 'pomodoro'];
    var dropZone;
    var draggableItems = [];
    var texts;

    function initIngredients(root) {
      root.children.forEach(function(child) {
        if (child.name === 'pane_base') {
          dropZone = child;
          dropZone.locked = true;
        } else if (child.name === 'Buon_appetito') {
          texts = child;
          var buonApp = texts.children['buon-appetito'];
          var creaPanino = texts.children['crea-il-tuo-panino'];
          if (buonApp) buonApp.opacity = 0;
          if (creaPanino) creaPanino.opacity = 1;
        } else if (child.name === 'Base') {
          child.locked = true;
        } else if (DRAGGABLE_IDS.indexOf(child.name) !== -1) {
          draggableItems.push(child);
          setupDrag(child, child.name);
        }
      });
    }

    var originalPositions = {};
    var buonAppAnimFrame = null;

    function showBuonAppetito() {
      if (!texts) return;
      var buonApp = texts.children['buon-appetito'];
      var creaPanino = texts.children['crea-il-tuo-panino'];
      if (!buonApp) return;
      if (creaPanino) creaPanino.opacity = 0;

      if (buonAppAnimFrame) cancelAnimationFrame(buonAppAnimFrame);

      var finalX = texts.position.x;
      var finalY = texts.position.y;
      var sX = texts.scaling.x;
      var sY = texts.scaling.y;

      texts.scaling = new paper.Point(sX, sY);
      texts.rotation = 0;
      texts.position.x = -600;
      texts.position.y = finalY;
      buonApp.opacity = 1;

      var kf = [
        [0.00, -600,       1,   1,   0],
        [0.40, finalX + 100, 1,   1,   0],
        [0.50, finalX + 50,  0.55, 1.55, 12],
        [0.65, finalX + 10,  1.25, 0.75, -4],
        [0.80, finalX,       0.95, 1.05, 1],
        [1.00, finalX,       1,   1,   0]
      ];
      var duration = 700;
      var startTime = null;

      function lerp(a, b, t) { return a + (b - a) * t; }

      function animate(ts) {
        if (!startTime) startTime = ts;
        var t = Math.min((ts - startTime) / duration, 1);

        for (var i = 0; i < kf.length - 1; i++) {
          if (t >= kf[i][0] && t <= kf[i+1][0]) {
            var seg = (t - kf[i][0]) / (kf[i+1][0] - kf[i][0]);
            var e = seg < 0.5 ? 2 * seg * seg : 1 - Math.pow(-2 * seg + 2, 2) / 2;
            texts.position.x = lerp(kf[i][1], kf[i+1][1], e);
            texts.scaling.x = sX * lerp(kf[i][2], kf[i+1][2], e);
            texts.scaling.y = sY * lerp(kf[i][3], kf[i+1][3], e);
            texts.rotation = lerp(kf[i][4], kf[i+1][4], e);
            break;
          }
        }

        if (t < 1) {
          buonAppAnimFrame = requestAnimationFrame(animate);
        } else {
          texts.position.x = finalX;
          texts.position.y = finalY;
          texts.scaling = new paper.Point(sX, sY);
          texts.rotation = 0;
          buonAppAnimFrame = null;
        }
      }

      buonAppAnimFrame = requestAnimationFrame(animate);
    }

    function hideBuonAppetito() {
      if (!texts) return;
      if (buonAppAnimFrame) {
        cancelAnimationFrame(buonAppAnimFrame);
        buonAppAnimFrame = null;
      }
      var buonApp = texts.children['buon-appetito'];
      var creaPanino = texts.children['crea-il-tuo-panino'];
      if (buonApp) buonApp.opacity = 0;
      if (creaPanino) creaPanino.opacity = 1;
    }

    function isOnDropZone(item) {
      if (!dropZone) return false;
      var dropBounds = dropZone.bounds.expand(0, 600);
      var ingBounds = item.bounds;
      return ingBounds.intersects(dropBounds);
    }

    function placeIngredient(item) {
      item.scale(1.8);
    }

    function returnToOriginal(item, name) {
      var orig = originalPositions[name];
      if (!orig) return;
      var startX = item.position.x;
      var startY = item.position.y;
      var duration = 200;
      var startTime = null;
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        var elapsed = timestamp - startTime;
        var t = Math.min(elapsed / duration, 1);
        var ease = 1 - Math.pow(1 - t, 3);
        item.position.x = startX + (orig.x - startX) * ease;
        item.position.y = startY + (orig.y - startY) * ease;
        if (t < 1) requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
