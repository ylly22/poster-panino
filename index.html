<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panino Interattivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f6846; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="https://unpkg.com/paper@0.12.17/dist/paper-full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <script>
    var svgRoot;

    function resizeCanvas() {
      var canvas = document.getElementById('canvas');
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    paper.setup('canvas');

    window.addEventListener('resize', function() {
      resizeCanvas();
      if (paper.view) {
        paper.view.viewSize = new paper.Size(canvas.width, canvas.height);
      }
      if (svgRoot) fitViewToSvg();
    });

    document.addEventListener('keydown', function(event) {
      if (event.code === 'Space') {
        event.preventDefault();
        location.reload();
      }
    });

    function fitViewToSvg() {
      var scale = Math.min(
        paper.view.viewSize.width / 841.89,
        paper.view.viewSize.height / 1190.55
      );
      paper.view.zoom = scale;
      paper.view.center = new paper.Point(841.89 / 2, 1190.55 / 2);
    }

    fetch('poster.svg')
      .then(function(response) { return response.text(); })
      .then(function(svgString) {
        var svg = paper.project.importSVG(svgString, { expandShapes: true });
        svgRoot = svg;
        fitViewToSvg();
        initIngredients(svg);
        loadCondiments();
      });

    var DRAGGABLE_IDS = ['cipolla', 'Insalata', 'Hamburger', 'Bacon', 'Formaggio', 'Panino_superiore', 'pomodoro'];
    var dropZone;
    var draggableItems = [];
    var texts;

    function initIngredients(root) {
      root.children.forEach(function(child) {
        if (child.name === 'pane_base') {
          dropZone = child;
          dropZone.locked = true;
        } else if (child.name === 'Buon_appetito') {
          texts = child;
          var buonApp = texts.children['buon-appetito'];
          var creaPanino = texts.children['crea-il-tuo-panino'];
          if (buonApp) buonApp.opacity = 0;
          if (creaPanino) creaPanino.opacity = 1;
        } else if (child.name === 'Base') {
          child.locked = true;
        } else if (DRAGGABLE_IDS.indexOf(child.name) !== -1) {
          draggableItems.push(child);
          setupDrag(child, child.name);
        }
      });
    }

    var originalPositions = {};

    function setupDrag(item, name) {
      originalPositions[name] = {
        x: item.position.x,
        y: item.position.y
      };

      var isPlaced = false;

      item.onMouseDown = function(event) {
        if (isPlaced && name !== 'Panino_superiore') return;
        item.bringToFront();

        if (name === 'Panino_superiore' && isPlaced) {
          hideBuonAppetito();
          isPlaced = false;
        }
      };

      item.onMouseDrag = function(event) {
        item.position.x += event.delta.x;
        item.position.y += event.delta.y;
      };

      item.onMouseUp = function(event) {
        if (isOnDropZone(item)) {
          if (!isPlaced) {
            placeIngredient(item);
            isPlaced = true;
            if (name === 'Panino_superiore') {
              showBuonAppetito();
            }
          }
        } else {
          if (name === 'Panino_superiore') {
            returnToOriginal(item, name);
            isPlaced = false;
            hideBuonAppetito();
          } else if (isPlaced) {
            // Other ingredients stay placed
          } else {
            returnToOriginal(item, name);
          }
        }
      };
    }

    function showBuonAppetito() {
      if (!texts) return;
      var buonApp = texts.children['buon-appetito'];
      var creaPanino = texts.children['crea-il-tuo-panino'];
      if (buonApp) buonApp.opacity = 1;
      if (creaPanino) creaPanino.opacity = 0;
      playTrumpet();
      confetti({
        particleCount: 300,
        spread: 120,
        origin: { y: 0.6 }
      });
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6, x: 0.3 }
      });
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6, x: 0.7 }
      });
    }

    function playTrumpet() {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach(function(freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.12);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.12 + 0.02);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.12 + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.12);
        osc.stop(ctx.currentTime + i * 0.12 + 0.15);
      });
    }

    function hideBuonAppetito() {
      if (!texts) return;
      var buonApp = texts.children['buon-appetito'];
      var creaPanino = texts.children['crea-il-tuo-panino'];
      if (buonApp) buonApp.opacity = 0;
      if (creaPanino) creaPanino.opacity = 1;
    }

    function isOnDropZone(item) {
      if (!dropZone) return false;
      var dropBounds = dropZone.bounds.expand(0, 600);
      var ingBounds = item.bounds;
      return ingBounds.intersects(dropBounds);
    }

    function placeIngredient(item) {
      item.scale(1.8);
    }

    function returnToOriginal(item, name) {
      var orig = originalPositions[name];
      if (!orig) return;
      var startX = item.position.x;
      var startY = item.position.y;
      var duration = 200;
      var startTime = null;
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        var elapsed = timestamp - startTime;
        var t = Math.min(elapsed / duration, 1);
        var ease = 1 - Math.pow(1 - t, 3);
        item.position.x = startX + (orig.x - startX) * ease;
        item.position.y = startY + (orig.y - startY) * ease;
        if (t < 1) requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }

    var floatingItems = [];

    function loadCondiments() {
      var files = ['ketchup.svg', 'mayo.svg', 'senape.svg'];
      Promise.all(files.map(function(f) {
        return fetch(f).then(function(r) { return r.text(); });
      })).then(function(svgStrings) {
        var templates = svgStrings.map(function(str) {
          return paper.project.importSVG(str, { expandShapes: true });
        });

        var bottlesPerType = 8;
        var totalBottles = bottlesPerType * templates.length;
        var verticalSpan = 1600;
        var spacing = verticalSpan / totalBottles;

        var posterWidth = 841.89;
        var margin = 20;

        for (var i = 0; i < totalBottles; i++) {
          var typeIndex = i % templates.length;
          var copy = templates[typeIndex].clone();
          var x = 30 + Math.random() * 780;
          var y = -150 - i * spacing + (Math.random() - 0.5) * spacing * 1.2;

          copy.position = new paper.Point(x, y);
          copy.scale(0.2 + Math.random() * 0.2);
          copy.opacity = 1;
          copy.locked = true;

          // Keep fully inside poster horizontally
          var halfW = copy.bounds.width / 2;
          copy.position.x = Math.max(halfW + margin, Math.min(posterWidth - halfW - margin, copy.position.x));

          copy.data = {
            speed: 50 + Math.random() * 150,
            drift: (Math.random() - 0.5) * 60,
            rot: (Math.random() - 0.5) * 90
          };
          if (svgRoot) {
            var baseIndex = -1;
            svgRoot.children.forEach(function(c, j) {
              if (c.name === 'Base') baseIndex = j;
            });
            if (baseIndex >= 0) {
              svgRoot.insertChild(baseIndex + 1, copy);
            }
          }
          floatingItems.push(copy);
        }

        templates.forEach(function(t) { t.remove(); });
        startFloatingAnimation();
      }).catch(function(err) {
        console.log('Could not load condiments:', err);
      });
    }

    function startFloatingAnimation() {
      paper.view.onFrame = function(event) {
        var dt = event.delta;
        for (var i = 0; i < floatingItems.length; i++) {
          var item = floatingItems[i];
          var d = item.data;
          item.position.y += d.speed * dt;
          item.position.x += d.drift * dt;
          item.rotation += d.rot * dt;

          // Keep fully inside poster horizontally
          var halfW = item.bounds.width / 2;
          var margin = 20;
          item.position.x = Math.max(halfW + margin, Math.min(841.89 - halfW - margin, item.position.x));

          if (item.position.y > 1300) {
            item.position.y = -150 - Math.random() * 600;
            item.position.x = 30 + Math.random() * 780;
            var halfW = item.bounds.width / 2;
            item.position.x = Math.max(halfW + 20, Math.min(841.89 - halfW - 20, item.position.x));
            d.speed = 50 + Math.random() * 150;
            d.drift = (Math.random() - 0.5) * 60;
          }
        }
      };
    }
  </script>
</body>
</html>
